[project]
name = "photoedit"
version = "0.1.0"
description = "Agent-driven, non-destructive RAW photo editor: apply styles to photos and export them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SigitasAmbrozaitis", email = "ambrozaitis.sigitas@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rawpy>=0.27.1",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
photoedit = "photoedit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoedit"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
]

# "×" is intentional in user-facing sizes like "1080×1350".
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["photoedit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
# Numeric warnings (overflow, divide by zero, invalid value) mean a render bug: fail instead of warning.
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "slow: long-running tests (benchmarks, full-resolution renders)",
    "golden: golden-image comparison tests that need real sample RAW files",
]

[tool.coverage.run]
source = ["photoedit"]
branch = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "scipy-stubs>=1.18.1.1",
    "types-psutil>=7.2.2.20260906",
]
